# bale-bot.yml — دانلودر یوتیوب روی گیت‌هاب برای ربات بله
# Worker کلادفلر این workflow را dispatch می‌کند؛ اجرای آن:
#   yt-dlp دانلود → فایل به Release کتابخانه (تگ library) → لینک دائمی به کاربر در بله
name: bale-bot

on:
  workflow_dispatch:
    inputs:
      VID:
        description: 'YouTube video id'
        required: true
      MODE:
        description: 'video | audio'
        required: false
        default: 'video'
      QUALITY:
        description: 'max height (240..720)'
        required: false
        default: '720'
      CHAT_ID:
        description: 'Bale chat id'
        required: true

permissions:
  contents: write

concurrency:
  group: bale-bot
  cancel-in-progress: false   # درخواست‌های جدید صف می‌شوند، نه لغو

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # [default] بستهٔ yt-dlp-ejs (اسکریپت‌های حل‌کنندهٔ چالش یوتیوب) را نصب می‌کند
      # [deno]    خودِ ران‌تایم JavaScript (بستهٔ رسمی denoland) را نصب می‌کند؛
      #           بدون آن yt-dlp چالش n را حل نمی‌کند و «فقط images» می‌بیند
      - name: Install yt-dlp + EJS solver + Deno runtime
        run: |
          python -m pip install --upgrade "yt-dlp[default,deno]"
          python -m yt_dlp --version
          deno --version

      - name: Download and serve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          COOKIES: ${{ secrets.COOKIES }}
          LIB_REPO: ${{ github.repository }}
          LIB_TAG: library
          VID: ${{ github.event.inputs.VID }}
          MODE: ${{ github.event.inputs.MODE }}
          QUALITY: ${{ github.event.inputs.QUALITY }}
          CHAT_ID: ${{ github.event.inputs.CHAT_ID }}
        run: python bale-bot.py
